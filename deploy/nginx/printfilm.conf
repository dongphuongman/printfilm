# Printfilm (ai-manju) — 宿主机 Nginx 反代 + 既有 GIF 服务
# 安装路径：/etc/nginx/sites-available/printfilm.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream printfilm_web {
    server 127.0.0.1:7050;
}

upstream printfilm_api {
    server 127.0.0.1:7051;
}

upstream gif_app {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name www.printfilm.com printfilm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.printfilm.com printfilm.com;

    ssl_certificate     /etc/letsencrypt/live/www.printfilm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.printfilm.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PrintfilmSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 110m;

    # GIF 子路径（保留旧服务）
    location = /gif {
        return 301 /gif/;
    }
    location /gif/ {
        proxy_pass http://gif_app/gif/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /gif;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Spring Boot API（含 SSE 长连接）
    location /api/v1/ {
        proxy_pass http://printfilm_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /_next/ {
        proxy_pass http://printfilm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://printfilm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
